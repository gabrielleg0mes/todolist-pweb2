<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TodoList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <button class="menu-btn">☰</button>
    <h1>TodoList</h1>
    <span class="topbar-spacer"></span>
  </header>

  <section id="app-screen" class="screen">
    <div class="app-card">
      <div class="app-header">
        <span class="brand">TodoList</span>
        <span class="greeting">Bom dia, <strong id="user-name">Samuel Lima</strong></span>
      </div>

      <div class="divider"></div>

      <div class="add-task">
        <label for="task-input">Adicionar tarefas</label>
        <div class="add-task-row">
          <input type="text" id="task-input" placeholder="Nome da tarefa">
          <button id="add-btn" class="btn-primary">Adicionar</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="tasks-header">
        <div>
          <h3>Minhas tarefas</h3>
          <p>Veja todas as suas tarefas criadas na plataforma.</p>
        </div>
        <div class="progress" id="progress-count">0 de 0 <span>concluídas</span></div>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state" style="display:none">
        <p>Nenhum registro encontrado!</p>
      </div>
    </div>
  </section>

<script src="script.js"></script>
</body>
</html>
